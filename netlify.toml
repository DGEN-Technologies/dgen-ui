[build]
  command = "bun run build"
  publish = "build"
  
  # Environment variables that should NOT be marked as secrets
  # These are public URLs that need to be accessible in the browser
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SOCKET,PUBLIC_DGEN_URL,PUBLIC_DOMAIN"

[functions]
  node_bundler = "esbuild"

# Security Headers - CRITICAL for preventing XSS and injection attacks
# Note: CSP is now managed by SvelteKit (svelte.config.js) with automatic nonce generation
# These headers provide additional defense-in-depth
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Force HTTPS (only in production)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Referrer policy
    Referrer-Policy = "no-referrer"
    # Permissions policy - disable unnecessary browser features.
    # camera=(self), NOT camera=(). An empty allowlist disables the camera for
    # every origin INCLUDING this one, so /scan's getUserMedia was refused
    # before the browser ever prompted — the permission showed as "denied"
    # while the browser setting still said "ask". (self) allows this origin
    # and nobody else. geolocation and microphone stay closed; nothing uses
    # them, and the QR scanner requests video only.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    # Cross-Origin policies for additional isolation.
    # NOT Cross-Origin-Embedder-Policy: require-corp. It demands that every
    # cross-origin resource opt in via CORP/COEP, and the SwapSpace widget
    # sends neither, so the swap iframe was refused with "swapspace.co can not
    # connect". Its only real benefit is cross-origin isolation for
    # SharedArrayBuffer, and neither Breez SDK uses SAB.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Basic auth for password protection
[context.production]
  environment = { NODE_ENV = "production" }

# Environment variables for different contexts
[context.deploy-preview]
  environment = { NODE_ENV = "production" }

[context.branch-deploy]
  environment = { NODE_ENV = "production" }

